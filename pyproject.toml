[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcriber-pro"
version = "1.0.0"
description = "Professional AI Transcription & SEO Tool for Content Creators"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "bagus", email = "fadingnotes9@gmail.com"},
]
keywords = ["youtube", "transcription", "ai", "seo", "whisper", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "click>=8.0.0",
    "rich>=10.0.0",
    "yt-dlp>=2023.1.1",
]

[project.scripts]
yt-transcriber = "main:cli"

[project.urls]
Homepage = "https://github.com/fadingnotes9-cmd/yt-transcriber-pro"
Repository = "https://github.com/fadingnotes9-cmd/yt-transcriber-pro"

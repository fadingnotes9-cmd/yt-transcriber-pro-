[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcriber-pro"
version = "1.0.0"
description = "Professional AI Transcription & SEO Tool"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=10.0.0",
    "yt-dlp"
]

# PENTING: Beritahu setuptools untuk HANYA mengambil main.py
[tool.setuptools]
py-modules = ["main"]

[project.scripts]
yt-transcriber = "main:cli"

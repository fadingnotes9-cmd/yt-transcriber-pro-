<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT Transcriber Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #0f172a; color: #e2e8f0; margin: 0; }
        h1 { color: #38bdf8; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-transcribe { background: #3b82f6; color: white; grid-column: span 2; }
        .btn-download { background: #10b981; color: white; }
        .btn-seo { background: #f59e0b; color: white; }
        .btn-list { background: #8b5cf6; color: white; }
        #status { margin-top: 20px; padding: 15px; background: #1e293b; border-radius: 8px; text-align: center; font-size: 14px; color: #94a3b8; border: 1px solid #334155; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🎬 YT Transcriber Pro</h1>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Tempel link YouTube di sini...">
    </div>

    <div class="grid">
        <button class="btn-transcribe" onclick="runCommand('transcribe')">🧠 Transkrip AI (Auto)</button>
        <button class="btn-download" onclick="runCommand('download')">📥 Download Subtitle</button>
        <button class="btn-seo" onclick="runCommand('seo')">🔍 Analisis SEO</button>
        <button class="btn-list" onclick="runCommand('list')">📂 Lihat File</button>
    </div>

    <div id="status">Siap memproses. Masukkan link YouTube.</div>

    <!-- Memuat logic JavaScript -->
    <script src="app.js"></script>
</body>
</html>
